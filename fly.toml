app = "bhc-hundred-days"
primary_region = "ewr"

[build]

[env]
  PORT = "3000"
  ARCADE_URL = "https://bhc-arcade.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
